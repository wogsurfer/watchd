name: Tests

# The backend's tests and the site's tests and build, on every push and pull
# request. None of them needs a database or API keys.
on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          # Matches the Docker image, which installs from uv.lock too.
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Test
        run: uv run --frozen --no-dev --with pytest python -m pytest tests -q
        env:
          PYTHONPATH: .
          # Placeholders the settings need to load; the tests mock the database.
          SECRET_KEY: ci-test-secret
          DATABASE_URL: postgresql+asyncpg://test:test@localhost/test

  frontend:
    name: Site tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
